
[workspace]
name = "robotics-fleet-manager"
version = "0.1.0"
description = "Robotics fleet orchestration and simulation platform"
authors = ["Hamza Ahmed Khan"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"

[pypi-dependencies]
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.5,<3.0"
sqlalchemy = { version = ">=2.0,<3.0", extras = ["asyncio"] }
alembic = ">=1.13,<2.0"
asyncpg = ">=0.29,<1.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
redis = ">=5.0,<8.0"
httpx = ">=0.27,<1.0"
websockets = ">=13,<17"
pyjwt = ">=2.9,<3.0"
pwdlib = { version = ">=0.2,<1.0", extras = ["argon2"] }
structlog = ">=24.0,<27.0"
prometheus-client = ">=0.21,<1.0"
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=0.24,<2.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.7,<1.0"
pyright = ">=1.1,<2.0"
maturin = ">=1.0, <2.0"

[tasks]
python-version = "python --version"
test = "pytest tests"
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyright apps/backend"
backend = "uvicorn apps.backend.main:app --reload --host 127.0.0.1 --port 8000"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
